<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="main-container">
        <!-- Input section -->
        <header class="input-container">
            <button class="location-btn" title="Use current location" aria-label="Use current location">
                <span class="material-symbols-outlined">my_location</span>
            </button>
            <input class="city-input" type="text" placeholder="Search City..." autocomplete="off">
            <button class="search-btn" title="Search" aria-label="Search">
                <span class="material-symbols-outlined">search</span>
            </button>
        </header>

        <!-- Loading State -->
        <section class="loading-state section-message" style="display: none;">
            <div class="spinner"></div>
            <p>Fetching weather data...</p>
        </section>

        <!-- Weather info section -->
        <section class="weather-info" style="display: none;">
            <div class="location-date-container">
                <div class="location">
                    <span class="material-symbols-outlined">location_on</span>
                    <h4 class="country-txt">--</h4>
                </div>
                <div class="header-right">
                    <h5 class="current-date-txt">--</h5>
                    <button class="unit-toggle-btn" title="Toggle °C / °F">°C</button>
                </div>
            </div>

            <div class="weather-summary-container">
                <img src="assets/weather/clouds.svg" class="weather-summary-img" alt="Weather condition">
                <div class="weather-summary-info">
                    <h1 class="temp-txt">-- °C</h1>
                    <h3 class="condition-txt">--</h3>
                </div>
            </div>

            <div class="weather-conditions-container">
                <div class="condition-item">
                    <span class="material-symbols-outlined">water_drop</span>
                    <div class="condition-info">
                        <h5>Humidity</h5>
                        <h5 class="humidity-value-txt">--%</h5>
                    </div>
                </div>
                <div class="condition-item">
                    <span class="material-symbols-outlined">air</span>
                    <div class="condition-info">
                        <h5>Wind Speed</h5>
                        <h5 class="wind-value-txt">-- M/s</h5>
                    </div>
                </div>
                <div class="condition-item">
                    <span class="material-symbols-outlined">thermostat</span>
                    <div class="condition-info">
                        <h5>Feels Like</h5>
                        <h5 class="feels-like-txt">-- °C</h5>
                    </div>
                </div>
            </div>

            <div class="forecast-header">
                <h5>5-Day Forecast</h5>
            </div>
            <div class="forecast-items-container">
                <!-- Forecast items injected via JS -->
            </div>
        </section>

        <!-- Search city message -->
        <section class="search-city section-message">
            <img src="assets/message/search-city.png" alt="Search city">
            <div>
                <h1>Search City</h1>
                <h4>Find out the weather conditions of any city in the world</h4>
            </div>
        </section>

        <!-- Not found message -->
        <section class="not-found section-message" style="display: none;">
            <img src="assets/message/not-found.png" alt="City not found">
            <div>
                <h1>City Not Found</h1>
                <h4>Please check the city name and try again</h4>
            </div>
        </section>
    </main>

    <script src="app.js" defer></script>
</body>
</html>
